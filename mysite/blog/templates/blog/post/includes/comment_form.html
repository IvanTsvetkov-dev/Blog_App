<h2>Добавить новый комментарий</h2>
<form action="{% url 'blog:post_comment' post.id %}" method="POST">
    {% csrf_token %}
    {% for field in form %}
        <div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label_tag }}</label></div>
        {{ field }}
        <div class="text-start">{{ field.errors }}</div>
    {% endfor %}
    <p><input type="submit" value='Добавить' class="btn btn-primary"></p>
</form>
